<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Display - Waiting Hall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-sky: #e0f2fe;
      --bg-warm: #fef9c3;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --accent: #f59e0b;
      --success: #10b981;
      --text-dark: #0f172a;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, var(--bg-sky) 0%, #f0fdf4 55%, var(--bg-warm) 100%);
      color: var(--text-dark);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: grid;
      grid-template-rows: 96px 1fr auto; 
    }

    /* Tap to Start Overlay (Unlocks TV Audio + WakeLock) */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      cursor: pointer;
    }
    #start-overlay h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    #start-overlay p {
      font-size: 1.8rem;
      opacity: 0.92;
      margin-bottom: 2.5rem;
    }
    #start-btn {
      background: #facc15;
      color: #0f172a;
      font-family: 'Fredoka', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      padding: 1.2rem 3.5rem;
      border: none;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }
    #start-btn:focus, #start-btn:hover {
      transform: scale(1.06);
      outline: 6px solid white;
    }

    /* Top Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border-bottom: 4px solid #bae6fd;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .brand img {
      height: 62px;
      width: 62px;
      object-fit: contain;
    }
    .brand h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.4rem;
      color: var(--primary);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    #next-queue {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0369a1;
      background: #e0f2fe;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      display: none;
    }
    #clock {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.6rem;
      color: var(--text-dark);
      letter-spacing: 1px;
    }
    #ws-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ef4444; 
      box-shadow: 0 0 12px #ef4444;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #ws-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Main Stage */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 3rem;
      position: relative;
    }

    /* Active Call Card */
    #call-card {
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 44px;
      border: 8px solid #38bdf8;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      animation: popIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 pulseGlow 2.4s infinite ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.82); opacity: 0; }
      70% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 20px 60px rgba(2, 132, 199, 0.22), 0 0 0 0 rgba(56, 189, 248, 0.45); }
      50% { box-shadow: 0 25px 80px rgba(2, 132, 199, 0.38), 0 0 0 24px rgba(56, 189, 248, 0); }
    }

    .calling-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: #fef3c7;
      color: #d97706;
      padding: 0.5rem 2.2rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      border: 3px solid #fde68a;
    }

    #called-name {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 165px;
      line-height: 1.08;
      color: var(--text-dark);
      word-break: break-word;
      max-width: 95%;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    #called-note {
      margin-top: 1.2rem;
      font-size: 3.8rem;
      font-weight: 900;
      color: #ffffff;
      background: var(--success);
      padding: 0.5rem 2.8rem;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }

    /* Friendly Idle Screen */
    #idle-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 5px dashed #93c5fd;
      border-radius: 44px;
      width: 100%;
      height: 100%;
      padding: 3rem;
    }
    #idle-logo {
      height: 150px;
      width: 150px;
      object-fit: contain;
      margin-bottom: 1.5rem;
      animation: floatLogo 3.5s ease-in-out infinite;
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    #idle-clinic-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 4.2rem;
      color: var(--primary);
      margin-bottom: 1.2rem;
    }
    #idle-message {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--text-muted);
      transition: opacity 0.4s;
    }

    /* Bottom Strip: Rekaan lebih padat tanpa skrol */
    footer {
      background: rgba(255, 255, 255, 0.92);
      border-top: 4px solid #bae6fd;
      padding: 1.2rem 2rem; /* Dikurangkan sedikit dari 1.5rem */
      display: flex;
      align-items: flex-start; 
      gap: 1.2rem;
      min-height: 120px;
      max-height: 50vh; /* Hadkan kepada 50% skrin jika penuh */
      overflow: hidden; /* BUANG SKROL SEPENUHNYA */
    }
    .footer-label {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.9rem;
      color: var(--text-muted);
      white-space: nowrap;
      border-right: 3px solid #cbd5e1;
      padding-right: 1.2rem;
      margin-top: 0.5rem; 
    }
    #recent-list {
      display: flex;
      flex-wrap: wrap; 
      align-items: center;
      gap: 0.8rem; /* Jarak antara kotak dirapatkan */
      flex: 1;
    }
    .recent-pill {
      background: #f1f5f9;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 0.5rem 1.2rem; /* Ruang dalam kotak dirapatkan */
      display: flex;
      align-items: center;
      gap: 0.6rem;
      white-space: nowrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .r-time {
      font-size: 1.2rem;
      font-weight: 800;
      color: #64748b;
    }
    .recent-pill .r-name {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem; /* Bersaiz optimum (tidak terlalu besar / tidak terlalu kecil) */
      color: var(--text-dark);
    }
    .recent-pill .r-note {
      font-size: 1.4rem; 
      font-weight: 800;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.2rem 0.8rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Tap to Start Overlay for TV Remote / Browser Autoplay Policy -->
  <div id="start-overlay" onclick="startDisplay()">
    <h1>📺 Sedia untuk Dipaparkan</h1>
    <p>Tekan <strong>OK</strong> pada alat kawalan TV atau tekan mana-mana untuk bunyikan suara</p>
    <button id="start-btn" autofocus>▶ Tekan Mula</button>
  </div>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <img id="header-logo" src="" alt="Logo" style="display:none;" />
      <h1 id="header-clinic-name">Sistem Panggilan</h1>
    </div>
    <div class="header-right">
      <div id="next-queue">Next: -</div>
      <div id="clock">00:00</div>
      <div id="ws-dot" title="Connection Status"></div>
    </div>
  </header>

  <!-- Main Center Stage -->
  <main>
    <div id="idle-card">
      <img id="idle-logo" src="" alt="Clinic Logo" style="display:none;" />
      <h2 id="idle-clinic-title">Selamat Datang!</h2>
      <p id="idle-message">Sila tunggu nama anak anda dipanggil ✨</p>
    </div>

    <div id="call-card">
      <div class="calling-badge">🔔 Memanggil / Now Calling</div>
      <div id="called-name">Aiman</div>
      <div id="called-note" style="display:none;">Bilik 1</div>
    </div>
  </main>

  <!-- Bottom Strip: Last Called Names -->
  <footer>
    <div class="footer-label">Baru Dipanggil<br><small>Recently Called</small></div>
    <div id="recent-list"></div>
  </footer>

  <script>
    let audioUnlocked = false;
    let audioCtx = null;
    let lastAnnouncedCallId = null;
    let audioSettings = { repeatCount: 1, repeatGapSeconds: 1, chimeVolume: 0.8, speechRate: 1.2 };

    // Rotating friendly idle messages
    const idleMessages = [
      "Sila tunggu nama anak anda dipanggil ✨",
      "Ibu bapa boleh memanggil nama anak melalui grup Telegram 📱"
    ];
    let idleIdx = 0;
    setInterval(() => {
      const el = document.getElementById('idle-message');
      el.style.opacity = 0;
      setTimeout(() => {
        idleIdx = (idleIdx + 1) % idleMessages.length;
        el.textContent = idleMessages[idleIdx];
        el.style.opacity = 1;
      }, 400);
    }, 5500);

    document.getElementById('header-logo').onerror = function() { this.style.display = 'none'; };
    document.getElementById('idle-logo').onerror = function() { this.style.display = 'none'; };

    // Live Clock (12-hour AM/PM format)
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { 
        hour: 'numeric', 
        minute: '2-digit', 
        hour12: true 
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
        } catch (e) {
          console.warn('WakeLock request failed:', e);
        }
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && audioUnlocked) requestWakeLock();
    });

    function startDisplay() {
      audioUnlocked = true;
      document.getElementById('start-overlay').style.display = 'none';
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      playChime(0.2); 
      requestWakeLock();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    function playChime(volume = 0.8) {
      return new Promise((resolve) => {
        if (!audioCtx) {
          resolve();
          return;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
        const now = audioCtx.currentTime;

        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.18);

          gain.gain.setValueAtTime(0.001, now + i * 0.18);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.05, volume), now + i * 0.18 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.65);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.18);
          osc.stop(now + i * 0.18 + 0.7);
        });

        setTimeout(resolve, 900);
      });
    }

    function speakOnce(ttsPayload) {
      return new Promise((resolve) => {
        if (ttsPayload && ttsPayload.audioUrl) {
          const audio = new Audio(ttsPayload.audioUrl);
          audio.onended = () => resolve();
          audio.onerror = () => {
            speakBrowserFallback(ttsPayload.plainText, ttsPayload.lang).then(resolve);
          };
          audio.play().catch(() => {
            speakBrowserFallback(ttsPayload.plainText, ttsPayload.lang).then(resolve);
          });
        } else if (ttsPayload) {
          speakBrowserFallback(ttsPayload.plainText, ttsPayload.lang).then(resolve);
        } else {
          resolve();
        }
      });
    }

    function speakBrowserFallback(text, lang) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) return resolve();
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang || 'ms-MY';
        utter.rate = audioSettings.speechRate || 1.2;
        utter.onend = () => resolve();
        utter.onerror = () => resolve();
        window.speechSynthesis.speak(utter);
      });
    }

    async function announceCall(callObj) {
      if (!audioUnlocked || !callObj) return;
      await playChime(audioSettings.chimeVolume);

      const repeats = audioSettings.repeatCount || 1;
      const gapMs = (audioSettings.repeatGapSeconds || 1) * 1000;

      for (let i = 0; i < repeats; i++) {
        await speakOnce(callObj.tts);
        if (i < repeats - 1) {
          await new Promise((r) => setTimeout(r, gapMs));
        }
      }
    }

    function adjustNameFontSize(name) {
      const el = document.getElementById('called-name');
      const len = name.length;
      if (len <= 8) el.style.fontSize = '175px';
      else if (len <= 14) el.style.fontSize = '150px';
      else if (len <= 20) el.style.fontSize = '120px';
      else el.style.fontSize = '96px';
    }

    function renderState(state) {
      if (state.audioSettings) audioSettings = state.audioSettings;

      document.getElementById('header-clinic-name').textContent = state.clinicName;
      document.getElementById('idle-clinic-title').textContent = state.clinicName;
      if (state.logoUrl) {
        const hLogo = document.getElementById('header-logo');
        const iLogo = document.getElementById('idle-logo');
        hLogo.src = state.logoUrl;
        iLogo.src = state.logoUrl;
        hLogo.style.display = 'block';
        iLogo.style.display = 'block';
      }

      const nextEl = document.getElementById('next-queue');
      if (state.upcoming && state.upcoming.length > 0) {
        nextEl.style.display = 'block';
        nextEl.textContent = 'Next: ' + state.upcoming.slice(0, 3).map((u) => u.name).join(', ');
      } else {
        nextEl.style.display = 'none';
      }

      const idleCard = document.getElementById('idle-card');
      const callCard = document.getElementById('call-card');

      if (state.current) {
        idleCard.style.display = 'none';
        callCard.style.display = 'flex';

        const nameEl = document.getElementById('called-name');
        const noteEl = document.getElementById('called-note');
        nameEl.textContent = state.current.name;
        adjustNameFontSize(state.current.name);

        if (state.current.note) {
          noteEl.textContent = state.current.note;
          noteEl.style.display = 'inline-block';
        } else {
          noteEl.style.display = 'none';
        }

        if (lastAnnouncedCallId !== state.current.id) {
          lastAnnouncedCallId = state.current.id;
          callCard.style.animation = 'none';
          void callCard.offsetWidth;
          callCard.style.animation = null;
          announceCall(state.current);
        }
      } else {
        callCard.style.display = 'none';
        idleCard.style.display = 'flex';
      }

      // Bottom Strip: Paparan nama yang lebih padat
      const recentContainer = document.getElementById('recent-list');
      recentContainer.innerHTML = '';
      
      const recentItems = (state.recent || [])
        .filter((r) => !state.current || r.id !== state.current.id)
        .slice(0, 20); 

      recentItems.forEach((item) => {
        const pill = document.createElement('div');
        pill.className = 'recent-pill';

        const callTime = new Date(item.calledAt || Date.now()); 
        const timeString = callTime.toLocaleTimeString('en-US', { 
          hour: 'numeric', 
          minute: '2-digit', 
          hour12: true 
        });

        const timeSpan = document.createElement('span');
        timeSpan.className = 'r-time';
        timeSpan.textContent = `[${timeString}]`;
        pill.appendChild(timeSpan);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'r-name';
        nameSpan.textContent = item.name;
        pill.appendChild(nameSpan);

        if (item.note) {
          const noteSpan = document.createElement('span');
          noteSpan.className = 'r-note';
          noteSpan.textContent = item.note;
          pill.appendChild(noteSpan);
        }
        recentContainer.appendChild(pill);
      });
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}/ws`);
      const dot = document.getElementById('ws-dot');

      ws.onopen = () => {
        dot.classList.add('connected');
      };
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'STATE_UPDATE') renderState(data);
        } catch (e) {
          console.error(e);
        }
      };
      ws.onclose = () => {
        dot.classList.remove('connected');
        setTimeout(connectWs, 2500);
      };
      ws.onerror = () => {
        ws.close();
      };
    }

    connectWs();
  </script>
</body>
</html>
